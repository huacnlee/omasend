[package]
name = "omasend"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "An Omarchy native LocalSend client"

[workspace]
exclude = ["vendor/localsend"]

[features]
default = ["desktop"]
ui = ["dep:nsh-core", "dep:nsh-base", "dep:rfd", "dep:arboard", "dep:image", "dep:open", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:toml"]
desktop = ["ui", "dep:nsh-platform-macos", "dep:nsh-platform-ios", "dep:jni", "dep:nsh-platform-linux", "dep:nsh-platform-windows"]
tui = ["ui", "dep:nsh-platform-tui", "dep:ratatui-core", "dep:ratatui-crossterm", "dep:crossterm"]
mobile = ["desktop"]
ui-tests = ["desktop"]

[dependencies]
nsh-platform-tui = { git = "https://github.com/longbridge/nsh", rev = "88987268529fee91c2787608c0b985c5b8cd52cd", default-features = false, features = ["run-app"], optional = true }
ratatui-core = { version = "0.1.2", optional = true }
ratatui-crossterm = { version = "0.1.2", optional = true }
crossterm = { version = "0.29", optional = true }
anyhow = "1"
async-channel = "2"
bytes = "1"
chrono = "0.4"
cap-std = "3"
dirs = "6"
futures-util = "0.3"
nsh-core = { git = "https://github.com/longbridge/nsh", rev = "88987268529fee91c2787608c0b985c5b8cd52cd", optional = true }
nsh-base = { git = "https://github.com/longbridge/nsh", rev = "88987268529fee91c2787608c0b985c5b8cd52cd", default-features = false, optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

localsend = { path = "vendor/localsend", features = ["discovery"] }
if-addrs = "0.15"
gethostname = "1.1"
mime_guess = "2"
semver = "1"
rust-i18n = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
self_update = { version = "1.3", default-features = false, features = ["ureq", "rustls", "github", "archive-tar", "compression-tar-gz", "archive-zip", "compression-zip-deflate", "checksums"] }

toml = { version = "0.8", optional = true }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "pollster"], optional = true }
arboard = { version = "3", default-features = false, features = ["image-data"], optional = true }
open = { version = "5", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"], optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString"], optional = true }
nsh-platform-macos = { git = "https://github.com/longbridge/nsh", rev = "88987268529fee91c2787608c0b985c5b8cd52cd", default-features = false, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { git = "https://github.com/longbridge/nsh", rev = "88987268529fee91c2787608c0b985c5b8cd52cd", default-features = false, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { git = "https://github.com/longbridge/nsh", rev = "88987268529fee91c2787608c0b985c5b8cd52cd", default-features = false, optional = true }

[dev-dependencies]
nsh-engine = { git = "https://github.com/longbridge/nsh", rev = "88987268529fee91c2787608c0b985c5b8cd52cd", default-features = false }
crossbeam-channel = "0.5"

[[bin]]
name = "omasend"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "omasend-tui"
path = "src/tui.rs"
required-features = ["tui"]

[profile.dev]
debug = "limited"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[build-dependencies]
cc = "1"

[target.'cfg(target_os = "ios")'.dependencies]
nsh-platform-ios = { git = "https://github.com/longbridge/nsh", rev = "88987268529fee91c2787608c0b985c5b8cd52cd", default-features = false, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", optional = true }
rustix = { version = "1", features = ["fs"] }
