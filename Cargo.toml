[package]
name = "omasend"
version = "0.1.2"
edition = "2024"
license = "MIT"
description = "An Omarchy native LocalSend client"

[workspace]
exclude = ["vendor/localsend", "vendor/gpui-omarchy"]

[features]
default = ["desktop"]
desktop = ["dep:gpui-omarchy", "dep:gpui-kit"]
ui-tests = ["desktop", "gpui-kit/test-support"]

[dependencies]
anyhow = "1"
async-channel = "2"
bytes = "1"
chrono = "0.4"
cap-std = "3"
dirs = "6"
futures-util = "0.3"
gpui-omarchy = { version = "0.1.2", optional = true }
# gpui-kit-assets carries the shared Lucide IconName from longbridge/gpui-kit#3020.
# Move back to a published version once that release is out.
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "abc47ce5b522de4b7300ea57e77236b2d95a1c4f", default-features = false, features = ["assets"], optional = true }
localsend = { path = "vendor/localsend", features = ["discovery"] }
if-addrs = "0.15"
gethostname = "1.1"
mime_guess = "2"
semver = "1"
rust-i18n = "3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
self_update = { version = "1.3", default-features = false, features = ["ureq", "rustls", "github", "archive-tar", "compression-tar-gz", "archive-zip", "compression-zip-deflate", "checksums"] }

[[bin]]
name = "omasend"
path = "src/main.rs"
required-features = ["desktop"]

[profile.dev]
debug = "limited"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

# Until gpui-omarchy 0.1.2 is published. It cannot be, while it depends on
# gpui-kit from git, so point at the branch carrying those changes and move to
# the release once both are out.
[patch.crates-io]
gpui-omarchy = { git = "https://github.com/huacnlee/gpui-omarchy", branch = "kit-assets-icons-and-submenus" }
