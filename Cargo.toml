[package]
name = "omasend"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "An Omarchy native LocalSend client"

[workspace]
exclude = ["vendor/localsend", "vendor/gpui-omarchy"]

[features]
default = ["desktop"]
desktop = ["dep:gpui-omarchy", "dep:gpui-base", "dep:gpui"]
ui-tests = ["desktop", "gpui/test-support"]

[dependencies]
anyhow = "1"
async-channel = "2"
bytes = "1"
chrono = "0.4"
cap-std = "3"
dirs = "6"
futures-util = "0.3"
gpui-omarchy = { version = "=0.1.0", optional = true }
gpui-base = { version = "=0.6.0", optional = true }
gpui = { package = "gpui-kit", version = "=0.6.0", default-features = false, optional = true }
localsend = { path = "vendor/localsend", features = ["discovery"] }
if-addrs = "0.15"
gethostname = "1.1"
mime_guess = "2"
semver = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt", "io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[[bin]]
name = "omasend"
path = "src/main.rs"
required-features = ["desktop"]

[profile.dev]
debug = "limited"

[patch.crates-io]
gpui-omarchy = { path = "vendor/gpui-omarchy" }
