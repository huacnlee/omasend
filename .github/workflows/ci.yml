name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-shell:
    name: NSH Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install GTK and clipboard build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libssl-dev libxcb1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            ext/omasend -> target
            .nsh/toolchain/f577c51901a2857956f8ba0580da4db9ce3a3311 -> target
          key: nsh-${{ matrix.os }}
      - run: cargo fmt --manifest-path ext/omasend/Cargo.toml --check
      - run: cargo clippy --manifest-path ext/omasend/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path ext/omasend/Cargo.toml --locked --features ui-tests --lib
      - run: cargo build --manifest-path ext/omasend/Cargo.toml --locked
      - name: Check standalone TUI
        run: cargo clippy --manifest-path ext/omasend/Cargo.toml --locked --no-default-features --features tui --bin omasend-tui -- -D warnings
      - name: Test TUI update policy
        run: cargo test --manifest-path ext/omasend/Cargo.toml --locked --no-default-features --features tui --lib updates::install
      - name: Bundle the TSX interface
        # The binaries embed the bundle (`OMASEND_BUNDLE`); only the TUI
        # smoke test below runs one.
        if: runner.os == 'Linux'
        run: |
          scripts/setup-nightly.sh
          .nsh/bin/nsh build --release -o .nsh/interface
          echo "OMASEND_BUNDLE=$PWD/.nsh/interface" >> "$GITHUB_ENV"
      - name: Build standalone TUI
        run: cargo build --manifest-path ext/omasend/Cargo.toml --locked --no-default-features --features tui --bin omasend-tui
      - name: Test TUI startup and terminal restoration
        if: runner.os == 'Linux'
        run: python3 scripts/test-tui.py ext/omasend/target/debug/omasend-tui
      - name: Verify TUI version
        shell: bash
        run: ./ext/omasend/target/debug/omasend-tui${{ runner.os == 'Windows' && '.exe' || '' }} --version

  website:
    name: Website build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      # The root tsconfig.json extends the generated .nsh/tsconfig.json, which the
      # website bundler resolves too; provide an empty base when NSH has not run.
      - run: test -f ../.nsh/tsconfig.json || { mkdir -p ../.nsh && echo '{}' > ../.nsh/tsconfig.json; }
      - run: bun run build
        env:
          SITE_URL: https://huacnlee.github.io
          BASE_PATH: /omasend

  quality:
    name: Formatting and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libssl-dev libxcb1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ext/omasend -> target
          key: ci-quality
      - name: Require native NSH backends
        run: python3 scripts/check-native-runtime.py
      - run: cargo fmt --manifest-path ext/omasend/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path ext/omasend/Cargo.toml --locked --all-targets --all-features -- -D warnings

  test:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libgtk-4-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libssl-dev libxcb1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ext/omasend -> target
          key: ci-tests
      - name: TUI release archive tests
        run: python scripts/test-tui-release.py
      - name: Unix installer tests
        run: python scripts/test-install.py
      - name: Arch package recipe tests
        run: python scripts/test-pkgbuild.py
      - name: Unit and integration tests
        run: cargo test --manifest-path ext/omasend/Cargo.toml --locked --no-default-features
      - name: NSH Rust interaction tests
        run: cargo test --manifest-path ext/omasend/Cargo.toml --locked --features ui-tests --lib
