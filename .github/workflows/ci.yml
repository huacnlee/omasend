name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-shell:
    name: NSH Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-2022, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install GTK and clipboard build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-4-dev libssl-dev libxcb1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: nsh-${{ matrix.os }}
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --features ui-tests --lib
      - run: cargo build --locked

  website:
    name: Website build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
      - run: bun run build
        env:
          SITE_URL: https://huacnlee.github.io
          BASE_PATH: /omasend

  quality:
    name: Formatting and Clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libgtk-4-dev libssl-dev libxcb1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-quality
      - name: Require native NSH backends
        run: python3 scripts/check-native-runtime.py
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test:
    name: Tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libgtk-4-dev libssl-dev libxcb1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-tests
      - name: Unix installer tests
        run: python scripts/test-install.py
      - name: Arch package recipe tests
        run: python scripts/test-pkgbuild.py
      - name: Unit and integration tests
        run: cargo test --locked --no-default-features
      - name: NSH Rust interaction tests
        run: cargo test --locked --features ui-tests --lib
