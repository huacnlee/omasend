name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            target: aarch64-apple-darwin
          - os: macos-26
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_TERM_COLOR: always
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libgtk-4-dev libssl-dev libxcb1-dev

      - name: Use a static Windows C runtime
        if: runner.os == 'Windows'
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Validate version and release tag
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path('Cargo.toml').read_text())['package']['version']
          if os.environ['RELEASE_REF'].startswith('refs/tags/') and os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit(f'Release tag must match Cargo.toml: v{version}')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write(f'version={version}\n')
          PY

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test Unix installer
        if: runner.os != 'Windows'
        run: python scripts/test-install.py

      - name: Validate PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path install.ps1), [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1

      - name: Test protocol and state
        # Run native tests; Intel macOS is cross-compiled on the ARM runner.
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --locked --no-default-features --target ${{ matrix.target }}

      - name: Require native NSH backends
        run: python scripts/check-native-runtime.py

      - name: Build release
        run: cargo build --locked --release --bin omasend --target ${{ matrix.target }}

      - name: Package release
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          binary="target/$RELEASE_TARGET/release/omasend"
          if [ "$RUNNER_OS" = Windows ]; then binary="$binary.exe"; fi
          python packaging/build-release.py --target "$RELEASE_TARGET" \
            --version "$RELEASE_VERSION" --binary "$binary" --output dist

      - name: Verify packaged native executable
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          extension=tar.gz
          if [ "$RUNNER_OS" = Windows ]; then extension=zip; fi
          options=()
          if [ "$RELEASE_TARGET" = x86_64-apple-darwin ]; then options+=(--no-run); fi
          python packaging/check-release.py \
            "dist/omasend-$RELEASE_VERSION-$RELEASE_TARGET.$extension" \
            --version "$RELEASE_VERSION" "${options[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  mobile:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: ios
          - os: ubuntu-24.04
            platform: android
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: longbridge/nsh
          ref: v0.3.0
          path: .nsh/toolchain
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        if: matrix.platform == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android dependencies
        if: matrix.platform == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libgtk-4-dev libssl-dev libxcb1-dev
          sdkmanager 'ndk;27.2.12479018' 'platforms;android-35' 'build-tools;36.0.0'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            .nsh/toolchain -> target
          key: mobile-${{ matrix.platform }}
      - name: Build pinned NSH CLI
        working-directory: .nsh/toolchain
        run: |
          cargo build --locked --release -p nsh-cli
          echo "$PWD/target/release" >> "$GITHUB_PATH"
      - name: Package unsigned iOS IPA
        if: matrix.platform == 'ios'
        run: python scripts/ios.py
      - name: Package signed Android APK
        if: matrix.platform == 'android'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          NSH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          python - <<'PY'
          import os, base64
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'omasend-release.p12'
          path.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64']))
          path.chmod(0o600)
          PY
          python scripts/android.py --keystore "$RUNNER_TEMP/omasend-release.p12"
      - name: Remove signing material
        if: always() && matrix.platform == 'android'
        run: rm -f "$RUNNER_TEMP/omasend-release.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, mobile]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Verify and combine checksums
        run: |
          cd dist
          cat *.sha256 | sort -k2 > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 7
          sha256sum --check SHA256SUMS
          rm -- *.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          prerelease=()
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --title "Omasend $RELEASE_TAG" "${prerelease[@]}" dist/*
